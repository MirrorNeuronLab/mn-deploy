# Local source of truth for Python packages published to Google Artifact Registry.
# Paths are relative to the mirror-neuron-set workspace root.

[[packages]]
name = "mirrorneuron-python-sdk"
path = "mn-python-sdk"
publish_group = "runtime"
installer_groups = ["sdk"]
binary_default = true

[[packages]]
name = "mirrorneuron-cli"
path = "mn-cli"
publish_group = "runtime"
installer_groups = ["cli"]
binary_default = true

[[packages]]
name = "mirrorneuron-api"
path = "mn-api"
publish_group = "runtime"
installer_groups = ["api"]
binary_default = true

[[packages]]
name = "mirrorneuron-membrane-python-sdk"
path = "Membrane/mn-context-engine-python-sdk"
publish_group = "membrane"
installer_groups = ["membrane-runtime"]
binary_default = true
build_formats = ["wheel"]

[[packages]]
name = "mn-context-auto-optimizer"
path = "Membrane/mn-context-auto-optimizer"
publish_group = "membrane"
installer_groups = ["membrane-tools"]
binary_default = false

[[packages]]
name = "mn-context-auto-optimizer-benchmark"
path = "Membrane/mn-context-auto-optimizer-benchmark"
