name: mirror-neuron

services:
  web-ui:
    image: ${MN_WEB_UI_IMAGE:-node:22-alpine}
    container_name: mirror-neuron-web-ui
    profiles:
      - web-ui
    restart: unless-stopped
    working_dir: /work
    environment:
      MN_WEB_UI_SOURCE_MODE: ${MN_WEB_UI_SOURCE_MODE:-package}
      MN_WEB_UI_PACKAGE_VERSION: ${MN_WEB_UI_PACKAGE_VERSION:-1.2.31}
      MN_WEB_UI_API_HOST: ${MN_WEB_UI_API_HOST:-host.docker.internal}
      MN_API_PORT: ${MN_API_PORT:-54001}
      MN_WEB_UI_PORT: ${MN_WEB_UI_PORT:-55173}
      MN_WEB_UI_SITE_DIR: /work/site
      npm_config_cache: /root/.npm
    ports:
      - "${MN_WEB_UI_BIND_HOST:-127.0.0.1}:${MN_WEB_UI_PORT:-55173}:${MN_WEB_UI_PORT:-55173}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${MN_WEB_UI_SOURCE_MOUNT:-./web-ui-source}:/mnt/mn-web-ui-source:ro
      - web-ui-npm-cache:/root/.npm
    command:
      - /bin/sh
      - -ec
      - |
          set -eu
          workdir=/work
          site_dir="$$MN_WEB_UI_SITE_DIR"
          rm -rf "$$workdir/package" "$$workdir/source" "$$site_dir"
          mkdir -p "$$site_dir"
          if [ "$$MN_WEB_UI_SOURCE_MODE" = "source" ]; then
            test -f /mnt/mn-web-ui-source/package.json
            mkdir -p "$$workdir/source"
            cp -a /mnt/mn-web-ui-source/. "$$workdir/source/"
            cd "$$workdir/source"
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi
            npm run build
            cp -a dist/. "$$site_dir/"
          else
            mkdir -p "$$workdir/package"
            cd "$$workdir/package"
            npm init -y >/dev/null 2>&1
            npm install --omit=dev "mirrorneuron-web-ui@$$MN_WEB_UI_PACKAGE_VERSION"
            cp -a node_modules/mirrorneuron-web-ui/dist/. "$$site_dir/"
          fi
          cat > "$$workdir/server.mjs" <<'NODE'
          import http from "node:http";
          import { createReadStream, existsSync, statSync } from "node:fs";
          import { extname, join, relative, resolve } from "node:path";

          const siteDir = resolve(process.env.MN_WEB_UI_SITE_DIR || "/work/site");
          const apiHost = process.env.MN_WEB_UI_API_HOST || "host.docker.internal";
          const apiPort = Number(process.env.MN_API_PORT || "54001");
          const port = Number(process.env.MN_WEB_UI_PORT || "55173");
          const contentTypes = {
            ".css": "text/css; charset=utf-8",
            ".html": "text/html; charset=utf-8",
            ".ico": "image/x-icon",
            ".js": "text/javascript; charset=utf-8",
            ".json": "application/json; charset=utf-8",
            ".map": "application/json; charset=utf-8",
            ".png": "image/png",
            ".svg": "image/svg+xml",
            ".woff2": "font/woff2",
          };

          function serveFile(response, file) {
            response.writeHead(200, {
              "Content-Type": contentTypes[extname(file)] || "application/octet-stream",
              "Cache-Control": file.endsWith("index.html") ? "no-cache" : "public, max-age=31536000, immutable",
            });
            createReadStream(file).pipe(response);
          }

          function proxyApi(request, response) {
            const headers = { ...request.headers, host: apiHost + ":" + apiPort };
            const upstream = http.request(
              { hostname: apiHost, port: apiPort, path: request.url, method: request.method, headers },
              (upstreamResponse) => {
                response.writeHead(upstreamResponse.statusCode || 502, upstreamResponse.headers);
                upstreamResponse.pipe(response);
              },
            );
            upstream.on("error", (error) => {
              if (!response.headersSent) {
                response.writeHead(502, { "Content-Type": "application/json" });
              }
              response.end(JSON.stringify({ detail: "API proxy unavailable", error: error.message }));
            });
            request.pipe(upstream);
          }

          http.createServer((request, response) => {
            const pathName = new URL(request.url || "/", "http://localhost").pathname;
            if (pathName === "/health") {
              response.writeHead(200, { "Content-Type": "application/json" });
              response.end(JSON.stringify({ status: "ok", component: "web-ui" }));
              return;
            }
            if (pathName === "/api" || pathName.startsWith("/api/")) {
              proxyApi(request, response);
              return;
            }
            let requested;
            try {
              requested = resolve(siteDir, "." + decodeURIComponent(pathName));
            } catch {
              response.writeHead(400);
              response.end();
              return;
            }
            if (relative(siteDir, requested).startsWith("..")) {
              response.writeHead(403);
              response.end();
              return;
            }
            const file = existsSync(requested) && statSync(requested).isFile()
              ? requested
              : join(siteDir, "index.html");
            serveFile(response, file);
          }).listen(port, "0.0.0.0", () => {
            console.log("MirrorNeuron Web UI listening on " + port);
          });
          NODE
          exec node "$$workdir/server.mjs"
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:' + process.env.MN_WEB_UI_PORT + '/health').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    networks:
      - runtime

  redis:
    image: ${MN_REDIS_IMAGE:-redis:8}
    container_name: mirror-neuron-redis
    restart: unless-stopped
    expose:
      - "6379"
    environment:
      MN_REDIS_PASSWORD: ${MN_REDIS_PASSWORD:-}
    command: >
      sh -c 'if [ -n "$$MN_REDIS_PASSWORD" ]; then
      exec redis-server --appendonly yes --requirepass "$$MN_REDIS_PASSWORD" --masterauth "$$MN_REDIS_PASSWORD";
      else
      exec redis-server --appendonly yes;
      fi'
    volumes:
      - redis-data:/data
    networks:
      runtime:
        aliases:
          - redis
          - ${MN_NODE_ALIAS:-mirror-neuron}-redis

  syncthing:
    image: ${MN_SYNCTHING_IMAGE:-syncthing/syncthing:latest}
    container_name: mirror-neuron-syncthing
    profiles:
      - syncthing
    restart: unless-stopped
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        set -eu
        config_dir="$${STHOMEDIR:-/var/syncthing/config}"
        config_file="$$config_dir/config.xml"
        mkdir -p "$$config_dir"

        if [ ! -f "$$config_file" ]; then
          /bin/syncthing generate --home "$$config_dir" --no-port-probing
        fi

        sed -i \
          -e 's#<relaysEnabled>[^<]*</relaysEnabled>#<relaysEnabled>false</relaysEnabled>#' \
          -e 's#<globalAnnounceEnabled>[^<]*</globalAnnounceEnabled>#<globalAnnounceEnabled>false</globalAnnounceEnabled>#' \
          -e 's#<natEnabled>[^<]*</natEnabled>#<natEnabled>false</natEnabled>#' \
          -e 's#<localAnnounceEnabled>[^<]*</localAnnounceEnabled>#<localAnnounceEnabled>true</localAnnounceEnabled>#' \
          -e 's#<stunKeepaliveStartS>[^<]*</stunKeepaliveStartS>#<stunKeepaliveStartS>0</stunKeepaliveStartS>#' \
          -e 's#<urAccepted>[^<]*</urAccepted>#<urAccepted>-1</urAccepted>#' \
          -e 's#<autoUpgradeIntervalH>[^<]*</autoUpgradeIntervalH>#<autoUpgradeIntervalH>0</autoUpgradeIntervalH>#' \
          -e 's#<crashReportingEnabled>[^<]*</crashReportingEnabled>#<crashReportingEnabled>false</crashReportingEnabled>#' \
          "$$config_file"

        # The policy setup above runs as root, while the image entrypoint
        # drops to PUID:PGID before starting Syncthing.  Hand the complete
        # generated configuration back to that runtime user so certificate
        # rotation and config updates work on bind mounts as well.
        chown -R "$${PUID:-1000}:$${PGID:-1000}" "$$config_dir"

        exec /bin/entrypoint.sh /bin/syncthing serve
    environment:
      STGUIADDRESS: 0.0.0.0:8384
      STGUIAPIKEY: ${MN_SYNCTHING_API_KEY:-}
      STHOMEDIR: /var/syncthing/config
      MN_SYNCTHING_LAN_ONLY: "1"
      MN_HOST_SHARED_STORAGE_ROOT: ${MN_HOST_SHARED_STORAGE_ROOT:-${MN_SHARED_STORAGE_ROOT:-${MN_HOST_SHARED_ARTIFACT_ROOT:-./mn/shared}}}
      MN_SYNCTHING_API_KEY: ${MN_SYNCTHING_API_KEY:-}
    ports:
      - "${MN_SYNCTHING_BIND_HOST:-0.0.0.0}:${MN_SYNCTHING_GUI_PORT:-58384}:8384/tcp"
      - "${MN_SYNCTHING_BIND_HOST:-0.0.0.0}:${MN_SYNCTHING_SYNC_PORT:-22000}:22000/tcp"
    volumes:
      - ${MN_HOST_HOME_DIR:-${MN_HOST_MN_DIR:-./mn}}/syncthing:/var/syncthing/config:rw
      - ${MN_HOST_SHARED_STORAGE_ROOT:-${MN_SHARED_STORAGE_ROOT:-${MN_HOST_SHARED_ARTIFACT_ROOT:-./mn/shared}}}:${MN_SYNCTHING_FOLDER_PATH:-/var/syncthing/MirrorNeuronShared}:rw
    networks:
      - runtime

  openshell:
    image: ${OPENSHELL_GATEWAY_IMAGE:-ghcr.io/nvidia/openshell/gateway:0.0.47}
    container_name: openshell-cluster-openshell
    command: ["--bind-address", "0.0.0.0", "--port", "${OPENSHELL_GATEWAY_PORT:-58080}"]
    user: "${OPENSHELL_GATEWAY_USER:-1000:1000}"
    group_add:
      - "${OPENSHELL_GATEWAY_DOCKER_GROUP:-0}"
    profiles:
      - openshell
    restart: unless-stopped
    expose:
      - "${OPENSHELL_GATEWAY_PORT:-58080}"
    ports:
      - "${OPENSHELL_GATEWAY_BIND_HOST:-127.0.0.1}:${OPENSHELL_GATEWAY_PORT:-58080}:${OPENSHELL_GATEWAY_PORT:-58080}"
    environment:
      HOME: ${MN_HOST_OPENSHELL_STATE_DIR:-./openshell-state}
      XDG_DATA_HOME: ${MN_HOST_OPENSHELL_STATE_DIR:-./openshell-state}/.local/share
      OPENSHELL_GATEWAY_CONFIG: ${MN_HOST_OPENSHELL_STATE_DIR:-./openshell-state}/gateway.toml
      OPENSHELL_DRIVERS: docker
      OPENSHELL_DB_URL: "sqlite:${MN_HOST_OPENSHELL_STATE_DIR:-./openshell-state}/openshell.db"
      OPENSHELL_DISABLE_TLS: "true"
      OPENSHELL_BIND_ADDRESS: 0.0.0.0
      OPENSHELL_SERVER_PORT: ${OPENSHELL_GATEWAY_PORT:-58080}
    volumes:
      - ${MN_HOST_OPENSHELL_STATE_DIR:-./openshell-state}:${MN_HOST_OPENSHELL_STATE_DIR:-./openshell-state}
      - ${DOCKER_HOST_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    networks:
      - runtime

  membrane-context-engine:
    image: ${ENGINE_IMAGE:-mirror-neuron-memory-engine:latest}
    container_name: mirror-neuron-context-engine
    profiles:
      - context
    build:
      context: ${MEMBRANE_DIR:-../Membrane}
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    expose:
      - "50052"
    environment:
      MN_CONTEXT_ADDR: 0.0.0.0:50052
      MN_CONTEXT_REDIS_URL: ${MN_CONTEXT_REDIS_URL:-redis://redis:6379/1}
      MN_CONTEXT_DEBUG: ${MN_CONTEXT_DEBUG:-0}
      MN_CONTEXT_DEBUG_DETAIL: ${MN_CONTEXT_DEBUG_DETAIL:-basic}
      MN_CONTEXT_DEBUG_DIR: /tmp/mn-context-engine/context-views
      MN_CONTEXT_MODEL_COMPRESSION_ENABLED: ${MN_CONTEXT_MODEL_COMPRESSION_ENABLED:-true}
      MN_CONTEXT_COMPRESSION_COMMAND: /usr/local/bin/mn_context_model_client.py
      MN_CONTEXT_MODEL_ENDPOINT: ${MN_CONTEXT_MODEL_ENDPOINT:-http://model-runner.docker.internal/engines/v1}
      MN_CONTEXT_MODEL_NAME: ${MN_CONTEXT_MODEL_NAME:-${MN_CONTEXT_MODEL_RUNNER_MODEL:-hf.co/homerquan/mn-context-engine-model-v-Q4_K_M}}
      MN_CONTEXT_MODEL_TIMEOUT_SECONDS: ${MN_CONTEXT_MODEL_TIMEOUT_SECONDS:-300}
    depends_on:
      redis:
        condition: service_started
    volumes:
      - context-debug:/tmp/mn-context-engine
    networks:
      - runtime

  mn-native-sdk-grpc:
    image: mirror-neuron-core:latest
    container_name: mirror-neuron-native-sdk-grpc
    restart: unless-stopped
    command:
      - python3
      - -u
      - -c
      - |
        import os
        import socket
        import threading

        listen_host = os.getenv("MN_NATIVE_SDK_GRPC_PROXY_LISTEN_HOST", "0.0.0.0")
        listen_port = int(os.getenv("MN_NATIVE_SDK_GRPC_PROXY_PORT", "55052"))
        target_host = os.getenv("MN_NATIVE_SDK_GRPC_PROXY_TARGET_HOST", "host.docker.internal")
        target_port = int(os.getenv("MN_NATIVE_SDK_GRPC_PROXY_TARGET_PORT", "55052"))

        def relay(src, dst):
            try:
                while True:
                    data = src.recv(65536)
                    if not data:
                        break
                    dst.sendall(data)
            finally:
                try:
                    dst.shutdown(socket.SHUT_WR)
                except OSError:
                    pass

        def handle(client):
            upstream = None
            try:
                upstream = socket.create_connection((target_host, target_port), timeout=10)
                upstream.settimeout(None)
                thread = threading.Thread(target=relay, args=(client, upstream), daemon=True)
                thread.start()
                relay(upstream, client)
            except Exception as exc:
                print(f"native SDK gRPC proxy connection failed: {exc}", flush=True)
            finally:
                for sock in (client, upstream):
                    if sock is None:
                        continue
                    try:
                        sock.close()
                    except OSError:
                        pass

        server = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
        server.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
        server.bind((listen_host, listen_port))
        server.listen(128)
        print(
            f"native SDK gRPC proxy listening on {listen_host}:{listen_port} -> {target_host}:{target_port}",
            flush=True,
        )

        while True:
            client, _addr = server.accept()
            threading.Thread(target=handle, args=(client,), daemon=True).start()
    environment:
      MN_NATIVE_SDK_GRPC_PROXY_LISTEN_HOST: 0.0.0.0
      MN_NATIVE_SDK_GRPC_PROXY_PORT: ${MN_NATIVE_SDK_GRPC_PROXY_PORT:-55052}
      MN_NATIVE_SDK_GRPC_PROXY_TARGET_HOST: ${MN_NATIVE_SDK_GRPC_PROXY_TARGET_HOST:-host.docker.internal}
      MN_NATIVE_SDK_GRPC_PROXY_TARGET_PORT: ${MN_NATIVE_SDK_GRPC_PROXY_TARGET_PORT:-${MN_NATIVE_SDK_GRPC_PORT:-55052}}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - runtime

  mn-litellm-proxy:
    image: mirror-neuron-core:latest
    container_name: mn-litellm-proxy
    restart: unless-stopped
    command: >
      sh -c 'mkdir -p /root/.mn/models/litellm-gateway;
      test -f /root/.mn/models/litellm-gateway/config.yaml ||
      printf "{\"model_list\":[]}\n" > /root/.mn/models/litellm-gateway/config.yaml;
      if command -v litellm >/dev/null 2>&1; then runner=litellm; else runner="python3 -m litellm"; fi;
      exec $$runner --config /root/.mn/models/litellm-gateway/config.yaml --host 0.0.0.0 --port 4000'
    expose:
      - "4000"
    ports:
      - "${MN_LITELLM_GATEWAY_BIND_HOST:-127.0.0.1}:${MN_LITELLM_GATEWAY_PORT:-4000}:4000"
    env_file:
      - path: ${MN_LITELLM_GATEWAY_ENV_FILE:-./docker-compose.env}
        required: false
    environment:
      HOME: /root
      MN_LITELLM_GATEWAY_INTERNAL_API_BASE: ${MN_LITELLM_GATEWAY_INTERNAL_API_BASE:-http://mn-litellm-proxy:4000/v1}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4000/v1/models >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - ${MN_HOST_HOME_DIR:-${MN_HOST_MN_DIR:-./mn}}:/root/.mn
      - ${MN_HOST_HOME_DIR:-${MN_HOST_MN_DIR:-./mn}}:/opt/mirror_neuron/.mn
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      runtime:
        aliases:
          - mn-litellm-proxy

  mirror-neuron-core:
    image: mirror-neuron-core:latest
    container_name: mirror-neuron-core
    restart: unless-stopped
    expose:
      - "50051"
      - "${MN_ARTIFACT_PORT:-55660}"
      - "${MN_EPMD_PORT:-54369}"
      - "${MN_DIST_PORT:-54370}"
    ports:
      - "${MN_GRPC_BIND_HOST:-127.0.0.1}:${MN_GRPC_PORT:-55051}:50051"
      - "${MN_ARTIFACT_PUBLISH_HOST:-127.0.0.1}:${MN_ARTIFACT_PORT:-55660}:${MN_ARTIFACT_PORT:-55660}"
    command: >
      sh -c 'if [ -x "bin/mirror_neuron" ]; then
      if [ -n "$$MN_NODE_NAME" ]; then
      if [ -z "$$MN_COOKIE" ] || [ "$$MN_COOKIE" = "mirrorneuron" ]; then
      echo "MN_COOKIE must be set to a non-default secret when MN_NODE_NAME enables distributed Erlang" >&2; exit 1;
      fi;
      unset ERL_EPMD_ADDRESS;
      epmd_bin="$$(find erts-* -path "*/bin/epmd" -type f | head -n 1)";
      "$$epmd_bin" -daemon;
      export RELEASE_DISTRIBUTION=name;
      export RELEASE_NODE="$$MN_NODE_NAME";
      export RELEASE_COOKIE="$$MN_COOKIE";
      else
      export RELEASE_DISTRIBUTION=none;
      fi;
      exec bin/mirror_neuron start;
      fi;
      if [ -n "$$MN_NODE_NAME" ]; then
      if [ -z "$$MN_COOKIE" ] || [ "$$MN_COOKIE" = "mirrorneuron" ]; then
      echo "MN_COOKIE must be set to a non-default secret when MN_NODE_NAME enables distributed Erlang" >&2; exit 1;
      fi;
      dist_port="$${MN_DIST_PORT:-4370}";
      unset ERL_EPMD_ADDRESS;
      epmd -daemon;
      exec elixir --name "$$MN_NODE_NAME" --cookie "$$MN_COOKIE" --erl "-kernel inet_dist_listen_min $${dist_port} inet_dist_listen_max $${dist_port}" -S mix run --no-halt;
      else exec mix run --no-halt; fi'
    environment:
      HOME: /root
      # Core runs in Docker while the native response service runs on the host.
      # Keep the Core side under the mounted runtime directory; the native
      # service resolves this to its own MN_HOME before opening job data.
      MN_HOME: /root/.mn
      MN_JOB_DATA_ROOT: /root/.mn/job-data
      MN_CORE_HOST: 0.0.0.0
      MN_REDIS_HOST: redis
      MN_REDIS_URL: ${MN_REDIS_URL:-redis://redis:6379/0}
      MN_REDIS_HA_MODE: ${MN_REDIS_HA_MODE:-single}
      MN_REDIS_SENTINELS: ${MN_REDIS_SENTINELS:-}
      MN_REDIS_SENTINEL_MASTER: ${MN_REDIS_SENTINEL_MASTER:-mirror-neuron}
      MN_REDIS_SENTINEL_HOST_MAP: ${MN_REDIS_SENTINEL_HOST_MAP:-}
      MN_REDIS_DB: ${MN_REDIS_DB:-0}
      MN_REDIS_USERNAME: ${MN_REDIS_USERNAME:-}
      MN_REDIS_PASSWORD: ${MN_REDIS_PASSWORD:-}
      MN_REDIS_SENTINEL_USERNAME: ${MN_REDIS_SENTINEL_USERNAME:-}
      MN_REDIS_SENTINEL_PASSWORD: ${MN_REDIS_SENTINEL_PASSWORD:-}
      MN_REDIS_WAIT_REPLICAS: ${MN_REDIS_WAIT_REPLICAS:-0}
      MN_REDIS_WAIT_TIMEOUT_MS: ${MN_REDIS_WAIT_TIMEOUT_MS:-100}
      MN_REDIS_RECONNECT_ATTEMPTS: ${MN_REDIS_RECONNECT_ATTEMPTS:-10}
      MN_REDIS_RECONNECT_BACKOFF_MS: ${MN_REDIS_RECONNECT_BACKOFF_MS:-250}
      MN_REDIS_RECONNECT_MAX_BACKOFF_MS: ${MN_REDIS_RECONNECT_MAX_BACKOFF_MS:-2000}
      # Service-owned Docker Compose projects can take longer than the
      # historic 15s job-control default to stop cleanly.  Keep this
      # configurable from docker-compose.env so hosts can raise it without
      # rebuilding the runtime image.
      MN_JOB_CALL_TIMEOUT_MS: ${MN_JOB_CALL_TIMEOUT_MS:-15000}
      MN_CANCEL_JOB_CALL_TIMEOUT_MS: ${MN_CANCEL_JOB_CALL_TIMEOUT_MS:-5000}
      MN_NETWORK_JOIN_TOKEN: ${MN_NETWORK_JOIN_TOKEN:-}
      MN_NETWORK_ADVERTISE_HOST: ${MN_NETWORK_ADVERTISE_HOST:-}
      MN_GRPC_ADVERTISE_PORT: ${MN_GRPC_ADVERTISE_PORT:-${MN_GRPC_PORT:-55051}}
      MN_MODEL_SERVICE_NODE_NAME: ${MN_MODEL_SERVICE_NODE_NAME:-}
      MN_NATIVE_SDK_GRPC_TARGET: ${MN_NATIVE_SDK_GRPC_TARGET:-mn-native-sdk-grpc:55052}
      MN_NETWORK_REDIS_HOST: ${MN_NETWORK_REDIS_HOST:-}
      MN_NETWORK_REDIS_PORT: ${MN_NETWORK_REDIS_PORT:-}
      MN_CONTEXT_ADDR: membrane-context-engine:50052
      MN_EXECUTOR_MAX_CONCURRENCY: ${MN_EXECUTOR_MAX_CONCURRENCY:-50}
      MN_NODE_ALIAS: ${MN_NODE_ALIAS:-}
      MN_DOCKER_NETWORK_MODE: ${MN_DOCKER_NETWORK_MODE:-}
      MN_DOCKER_NETWORK_NAME: ${MN_DOCKER_NETWORK_NAME:-}
      MN_NODE_NAME: ${MN_NODE_NAME:-}
      MN_NODE_ROLE: ${MN_NODE_ROLE:-runtime}
      MN_NODE_HARDWARE_JSON: ${MN_NODE_HARDWARE_JSON:-}
      MN_NODE_DISPLAY_NAME: ${MN_NODE_DISPLAY_NAME:-}
      MN_NODE_CPU_CORES: ${MN_NODE_CPU_CORES:-}
      MN_NODE_CPU_MODEL: ${MN_NODE_CPU_MODEL:-}
      MN_NODE_MEMORY_TOTAL_MB: ${MN_NODE_MEMORY_TOTAL_MB:-}
      MN_NODE_MEMORY_AVAILABLE_MB: ${MN_NODE_MEMORY_AVAILABLE_MB:-}
      MN_NODE_DISK_TOTAL_MB: ${MN_NODE_DISK_TOTAL_MB:-}
      MN_NODE_DISK_AVAILABLE_MB: ${MN_NODE_DISK_AVAILABLE_MB:-}
      MN_NODE_HOST_PATHS: ${MN_NODE_HOST_PATHS:-}
      MN_NODE_RUNTIME_DRIVERS: ${MN_NODE_RUNTIME_DRIVERS:-}
      MN_NODE_GPU: ${MN_NODE_GPU:-}
      MN_NODE_GPU_COUNT: ${MN_NODE_GPU_COUNT:-}
      MN_NODE_GPU_VENDOR: ${MN_NODE_GPU_VENDOR:-}
      MN_NODE_GPU_DRIVER: ${MN_NODE_GPU_DRIVER:-}
      MN_NODE_GPU_TYPE: ${MN_NODE_GPU_TYPE:-}
      MN_NODE_GPU_NAME: ${MN_NODE_GPU_NAME:-}
      MN_NODE_GPU_API_VERSION: ${MN_NODE_GPU_API_VERSION:-}
      MN_NODE_GPU_DRIVER_VERSION: ${MN_NODE_GPU_DRIVER_VERSION:-}
      MN_NODE_GPU_MEMORY_TOTAL_MB: ${MN_NODE_GPU_MEMORY_TOTAL_MB:-}
      MN_NODE_GPU_MEMORY_FREE_MB: ${MN_NODE_GPU_MEMORY_FREE_MB:-}
      MN_NODE_GPU_MEMORY_USED_MB: ${MN_NODE_GPU_MEMORY_USED_MB:-}
      MN_NODE_GPU_SHARED_MEMORY: ${MN_NODE_GPU_SHARED_MEMORY:-}
      MN_NODE_GPU_INTEGRATED: ${MN_NODE_GPU_INTEGRATED:-}
      MN_NODE_GPU_UNIFIED_MEMORY: ${MN_NODE_GPU_UNIFIED_MEMORY:-}
      MN_NODE_GPU_UNIFIED_MEMORY_MB: ${MN_NODE_GPU_UNIFIED_MEMORY_MB:-}
